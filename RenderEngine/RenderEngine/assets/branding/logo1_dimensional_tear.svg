<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 1 · Dimensional Tear: trhlina v tmavom priestore, cez ktoru je vidiet herny svet (neonovy horizont) -->
  <defs>
    <linearGradient id="t-bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0B1E"/><stop offset="1" stop-color="#1B1038"/></linearGradient>
    <linearGradient id="t-sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2B86C5"/><stop offset=".55" stop-color="#9D4EDD"/><stop offset="1" stop-color="#FF3CAC"/></linearGradient>
    <linearGradient id="t-sun" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE66D"/><stop offset="1" stop-color="#FF6B9D"/></linearGradient>
    <filter id="t-glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
    <path id="t-shape" d="M128 18 L114 52 L100 60 L94 98 L78 118 L86 150 L98 176 L104 206 L128 238 L144 208 L158 194 L162 160 L178 134 L168 104 L160 84 L154 50 Z"/>
    <clipPath id="t-tear"><use href="#t-shape"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#t-bg)"/>
  <g fill="#fff" opacity=".7"><circle cx="44" cy="52" r="1.6"/><circle cx="206" cy="40" r="1.2"/><circle cx="214" cy="188" r="1.8"/><circle cx="58" cy="200" r="1.2"/><circle cx="196" cy="118" r="1"/><circle cx="36" cy="132" r="1"/></g>
  <use href="#t-shape" fill="#22D3EE" filter="url(#t-glow)" opacity=".9"/>
  <g clip-path="url(#t-tear)">
    <rect x="70" y="10" width="120" height="240" fill="url(#t-sky)"/>
    <circle cx="130" cy="150" r="34" fill="url(#t-sun)"/>
    <g fill="#9D4EDD"><rect x="90" y="138" width="80" height="3"/><rect x="90" y="147" width="80" height="4"/><rect x="90" y="157" width="80" height="5"/></g>
    <rect x="70" y="166" width="120" height="90" fill="#140A2E"/>
    <g stroke="#FF3CAC" stroke-width="1.6" fill="none">
      <line x1="80" y1="172" x2="180" y2="172"/><line x1="80" y1="182" x2="180" y2="182"/><line x1="80" y1="198" x2="180" y2="198"/><line x1="80" y1="222" x2="180" y2="222"/>
      <line x1="130" y1="166" x2="130" y2="250"/><line x1="130" y1="166" x2="90" y2="250"/><line x1="130" y1="166" x2="170" y2="250"/><line x1="130" y1="166" x2="50" y2="250"/><line x1="130" y1="166" x2="210" y2="250"/>
    </g>
  </g>
  <use href="#t-shape" fill="none" stroke="#E0FBFF" stroke-width="2.5" stroke-linejoin="round"/>
  <polygon points="176,64 186,58 182,72" fill="#67E8F9"/><polygon points="62,168 54,180 68,178" fill="#C084FC"/>
</svg>
