<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 2 · Voxel R: R postavene z hernych kociek (stavanie ako v Roblox Studiu), jedna kocka vyskocila cez trhlinu -->
  <defs>
    <linearGradient id="v-bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1E1B4B"/><stop offset="1" stop-color="#0F0A24"/></linearGradient>
    <g id="v-c"><polygon points="0,-12 20,-2 0,8 -20,-2" fill="#C4B5FD"/><polygon points="-20,-2 0,8 0,30 -20,20" fill="#7C3AED"/><polygon points="0,8 20,-2 20,20 0,30" fill="#4C1D95"/></g>
    <g id="v-g"><polygon points="0,-12 20,-2 0,8 -20,-2" fill="#CFFAFE"/><polygon points="-20,-2 0,8 0,30 -20,20" fill="#22D3EE"/><polygon points="0,8 20,-2 20,20 0,30" fill="#0E7490"/></g>
    <filter id="v-glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="7"/></filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#v-bg)"/>
  <!-- mriezka 3x5 (R), kreslene zhora nadol a zlava doprava, aby sa kocky spravne prekryvali -->
  <g transform="translate(70,58)">
    <use href="#v-c" x="0" y="0"/><use href="#v-c" x="40" y="0"/>
    <use href="#v-c" x="0" y="30"/><use href="#v-c" x="80" y="30"/>
    <use href="#v-c" x="0" y="60"/><use href="#v-c" x="40" y="60"/>
    <use href="#v-c" x="0" y="90"/>
    <ellipse cx="80" cy="100" rx="22" ry="7" fill="#22D3EE" filter="url(#v-glow)"/>
    <ellipse cx="80" cy="100" rx="14" ry="3" fill="#E0FBFF"/>
    <use href="#v-c" x="0" y="120"/><use href="#v-c" x="80" y="120"/>
    <use href="#v-g" x="104" y="74" transform="rotate(14 104 84)"/>
  </g>
</svg>
