<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- 3 · Crystal Shard: fazetovany krystal (low-poly 3D) rozlomeny trhlinou, zvnutra presvitajuce svetlo -->
  <defs>
    <radialGradient id="s-bg" cx=".5" cy=".45" r=".7"><stop offset="0" stop-color="#241A4D"/><stop offset="1" stop-color="#0A0817"/></radialGradient>
    <filter id="s-glow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="8"/></filter>
    <g id="s-gem">
      <polygon points="128,22 128,128 62,96" fill="#A78BFA"/>
      <polygon points="128,22 194,96 128,128" fill="#7C3AED"/>
      <polygon points="62,96 128,128 128,234" fill="#5B21B6"/>
      <polygon points="128,128 194,96 128,234" fill="#3B0E7A"/>
      <polygon points="128,22 104,104 128,128" fill="#DDD6FE" opacity=".55"/>
      <polygon points="128,128 166,112 150,186" fill="#6D28D9" opacity=".6"/>
    </g>
    <clipPath id="s-l"><polygon points="0,0 150,0 118,100 140,130 106,256 0,256"/></clipPath>
    <clipPath id="s-r"><polygon points="150,0 256,0 256,256 106,256 140,130 118,100"/></clipPath>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#s-bg)"/>
  <polyline points="150,4 118,100 140,130 106,252" fill="none" stroke="#F0ABFC" stroke-width="16" filter="url(#s-glow)" opacity=".8"/>
  <g clip-path="url(#s-l)"><use href="#s-gem" transform="translate(-9,4) rotate(-3 128 128)"/></g>
  <g clip-path="url(#s-r)"><use href="#s-gem" transform="translate(9,-4) rotate(3 128 128)"/></g>
  <polyline points="150,4 118,100 140,130 106,252" fill="none" stroke="#FFF" stroke-width="2.5" stroke-linejoin="round"/>
  <g fill="#F5D0FE"><polygon points="182,50 190,44 188,56"/><polygon points="66,190 58,200 70,198"/><circle cx="200" cy="168" r="2"/></g>
</svg>
